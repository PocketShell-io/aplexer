name: macOS port

# Runs in the alexeygrigorev/aplexer-macos-ci mirror (the PocketShell-io org
# cannot run GitHub Actions): GitHub-hosted Intel + Apple Silicon runners
# execute the full test suite and a start/list/stop smoke against the real
# binary. See docs/macos-port.md.
#
# If org Actions are ever enabled, this same file runs there unchanged.

on:
  push:
    branches:
      - main
      - "macos-*"
      - "hub-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: cargo test + smoke (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    # Guard so a hung session can never burn the account's Actions quota.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.85.0"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}-macos-port

      - name: Run Rust tests
        run: cargo test --locked --verbose

      - name: Smoke start/list/stop on the real binary
        run: |
          cargo build --locked --bins
          ./target/debug/aplexer --version
          export APLEXER_STATE_DIR="$(mktemp -d)" APLEXER_RUNTIME_DIR="$(mktemp -d)"
          ./target/debug/aplexer start --workspace "$RUNNER_TEMP" --tag "smoke-${{ matrix.arch }}" -- sleep 60
          ./target/debug/aplexer list | grep "smoke-${{ matrix.arch }}"
          ./target/debug/aplexer kill "smoke-${{ matrix.arch }}"
          ./target/debug/aplexer prune || true
          rm -rf "$APLEXER_STATE_DIR" "$APLEXER_RUNTIME_DIR"
